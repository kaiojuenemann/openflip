name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older, still running checks:
# they test code that is already superseded and would only hold runners
# (macOS runners are scarce). Pushes to main always run to completion.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is checked in the "macOS" job below, together with the
        # bundles, so each run needs a single macOS runner.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build release
        run: cargo build --release

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build openflip.app and OpenFlip.saver
        run: platform/macos/build.sh
      - name: Load and run the screensaver
        run: OPENFLIP_LOG=1 swift platform/macos/smoke-test.swift target/macos/OpenFlip.saver
      - name: Render with Metal
        run: target/macos/openflip.app/Contents/MacOS/openflip --screenshot target/macos/screenshot.png --time 10:42:07
      - name: Package
        run: |
          cp platform/macos/README.md target/macos/INSTALL.md
          cd target/macos
          zip -qry openflip-macos.zip OpenFlip.saver openflip.app INSTALL.md
      - uses: actions/upload-artifact@v4
        with:
          name: openflip-macos
          path: |
            target/macos/openflip-macos.zip
            target/macos/screenshot.png

  windows-package:
    name: Windows package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p openflip-app
      - name: Assemble
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target\windows | Out-Null
          Copy-Item target\release\openflip.exe target\windows\openflip.exe
          Copy-Item target\release\openflip.exe target\windows\openflip.scr
          Copy-Item platform\windows\README.md target\windows\INSTALL.md
      - name: Render with Direct3D
        run: target\windows\openflip.exe --screenshot target\windows\screenshot.png --time 10:42:07
      - name: Run as screensaver, settings and preview
        shell: pwsh
        run: platform\windows\smoke-test.ps1 target\windows\openflip.scr
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path target\windows\openflip.scr, target\windows\openflip.exe, target\windows\INSTALL.md -DestinationPath target\windows\openflip-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: openflip-windows
          path: |
            target/windows/openflip-windows.zip
            target/windows/screenshot.png

  linux-package:
    name: Linux package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install X server, software Vulkan and XScreenSaver
        # libxkbcommon-x11 comes with every desktop, but not with the runner.
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool mesa-vulkan-drivers libxkbcommon-x11-0 xscreensaver
      - name: Build
        run: cargo build --release --locked -p openflip-app
      - name: Run as app, screensaver, embedded and XScreenSaver hack
        run: platform/linux/smoke-test.sh target/release/openflip
      - name: Package
        run: |
          mkdir -p target/linux
          cp target/release/openflip platform/linux/openflip.xml target/linux/
          cp platform/linux/README.md target/linux/INSTALL.md
          tar czf target/openflip-linux-x86_64.tar.gz -C target/linux .
      - uses: actions/upload-artifact@v4
        with:
          name: openflip-linux
          path: target/openflip-linux-x86_64.tar.gz

  gpu-tests:
    name: GPU tests (lavapipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install software Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: Render tests
        run: cargo test -- --ignored
      - name: Render screenshot
        run: cargo run --release -- --screenshot screenshot.png --time 10:42:07
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: screenshot.png
