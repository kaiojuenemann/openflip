name: CI

on:
  push:
    branches: [main]
    # A version tag builds everything once more and drafts a GitHub release
    # with the packages (see the release job at the end).
    tags: ['v*']
  pull_request:
  # "Run workflow" on main in the Actions tab: the same, without a tag.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older, still running checks:
# they test code that is already superseded and would only hold runners
# (macOS runners are scarce). Pushes to main always run to completion.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is checked in the "macOS" job below, together with the
        # bundles, so each run needs a single macOS runner.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install ALSA headers (sound)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build release
        run: cargo build --release

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build openflip.app and OpenFlip.saver
        run: platform/macos/build.sh
      - name: Load and run the screensaver
        run: OPENFLIP_LOG=1 swift platform/macos/smoke-test.swift target/macos/OpenFlip.saver
      - name: Render with Metal
        run: target/macos/openflip.app/Contents/MacOS/openflip --screenshot target/macos/screenshot.png --time 10:42:07
      - name: Package
        run: |
          cp platform/macos/README.md target/macos/INSTALL.md
          cd target/macos
          zip -qry openflip-macos.zip OpenFlip.saver openflip.app INSTALL.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openflip-macos
          path: |
            target/macos/openflip-macos.zip
            target/macos/screenshot.png

  windows-package:
    name: Windows package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build
        run: cargo build --release --locked -p openflip-app
      - name: Assemble
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target\windows | Out-Null
          Copy-Item target\release\openflip.exe target\windows\openflip.exe
          Copy-Item target\release\openflip.exe target\windows\openflip.scr
          Copy-Item platform\windows\README.md target\windows\INSTALL.md
      - name: Render with Direct3D
        run: target\windows\openflip.exe --screenshot target\windows\screenshot.png --time 10:42:07
      - name: Run as screensaver, settings and preview
        shell: pwsh
        run: platform\windows\smoke-test.ps1 target\windows\openflip.scr
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path target\windows\openflip.scr, target\windows\openflip.exe, target\windows\INSTALL.md -DestinationPath target\windows\openflip-windows.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openflip-windows
          path: |
            target/windows/openflip-windows.zip
            target/windows/screenshot.png

  linux-package:
    name: Linux package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install X server, software Vulkan and XScreenSaver
        # libxkbcommon-x11 comes with every desktop, but not with the runner.
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool mesa-vulkan-drivers libxkbcommon-x11-0 xscreensaver libasound2-dev
      - name: Build
        run: cargo build --release --locked -p openflip-app
      - name: Run as app, screensaver, embedded and XScreenSaver hack
        run: platform/linux/smoke-test.sh target/release/openflip
      - name: Package
        run: |
          mkdir -p target/linux
          cp target/release/openflip platform/linux/openflip.xml target/linux/
          cp platform/linux/README.md target/linux/INSTALL.md
          tar czf target/openflip-linux-x86_64.tar.gz -C target/linux .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openflip-linux
          path: target/openflip-linux-x86_64.tar.gz

  gpu-tests:
    name: GPU tests (lavapipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install software Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libasound2-dev
      - name: Render tests
        run: cargo test -- --ignored
      - name: Render screenshot
        run: cargo run --release -- --screenshot screenshot.png --time 10:42:07
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: screenshot
          path: screenshot.png

  release:
    name: Draft GitHub release
    # Either "Run workflow" on main in the Actions tab, or a pushed tag v*.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: [check, macos, windows-package, linux-package, gpu-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: signs a statement that these files came from this
      # workflow run (see the attestation step).
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Version and tag
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              # Publishing the draft made by "Run workflow" creates the tag,
              # and that tag runs this workflow again: nothing left to do.
              echo "::notice::release $tag exists already"
              echo "SKIP=1" >> "$GITHUB_ENV"
            else
              echo "::error::release $tag exists already: raise the version in Cargo.toml and CHANGELOG.md, or delete the draft"
              exit 1
            fi
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Release notes from CHANGELOG.md
        if: env.SKIP != '1'
        run: |
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            /^\[[^]]*\]: / { if (found) exit }
            found
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.SKIP != '1'
        with:
          pattern: openflip-*
          path: packages
          merge-multiple: true
      - name: Name the packages and write checksums
        if: env.SKIP != '1'
        run: |
          cd packages
          mv openflip-macos.zip "openflip-$VERSION-macos.zip"
          mv openflip-windows.zip "openflip-$VERSION-windows.zip"
          mv openflip-linux-x86_64.tar.gz "openflip-$VERSION-linux-x86_64.tar.gz"
          sha256sum openflip-$VERSION-* > SHA256SUMS
          cat SHA256SUMS
      - name: Attest where the packages were built
        # GitHub offers attestations for public repositories (private ones
        # need GitHub Enterprise); until then the checksums must do.
        if: env.SKIP != '1' && !github.event.repository.private
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: packages/openflip-*
      - name: Draft the release
        if: env.SKIP != '1'
        # A draft, so the release is looked over and published by hand. From
        # "Run workflow" the tag does not exist yet: publishing the draft
        # creates it on the commit that was built.
        run: |
          cd packages
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            where="--verify-tag"
          else
            where="--target=$GITHUB_SHA"
          fi
          gh release create "$TAG" --draft "$where" \
            --title "openflip $VERSION" --notes-file ../notes.md \
            "openflip-$VERSION-macos.zip" \
            "openflip-$VERSION-windows.zip" \
            "openflip-$VERSION-linux-x86_64.tar.gz" \
            SHA256SUMS
