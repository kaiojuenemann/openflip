[workspace]
resolver = "2"
members = [
    "crates/openflip-core",
    "crates/openflip-render",
    "crates/openflip-host",
    "crates/openflip-ffi",
    "crates/openflip-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/kaiojuenemann/openflip"

[workspace.dependencies]
openflip-core = { path = "crates/openflip-core" }
openflip-render = { path = "crates/openflip-render" }
openflip-host = { path = "crates/openflip-host" }
ab_glyph_rasterizer = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "6"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
png = "0.18"
pollster = "1.0"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
raw-window-handle = "0.6"
wgpu = "30"
windows-sys = "0.61"
# Wayland decorations without title text: the titled variant pulls in
# ab_glyph/ttf-parser, which is unmaintained (RUSTSEC-2026-0192).
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }
x11rb = { version = "0.14", features = ["randr"] }
rfd = "0.17"
sys-locale = "0.3"
skrifa = "0.49"
rodio = { version = "0.23", default-features = false, features = ["playback"] }
